[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-metadata-cleaner"
version = "0.2.0"
description = "Remove EXIF/GPS metadata from images — privacy-first cleaner with batch mode, watermark and Flask API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["exif", "metadata", "privacy", "images", "security-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow==11.1.0",
    "piexif==1.1.3",
    "flask==3.1.0",
]

[project.scripts]
img-clean = "cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools.packages.find]
include = ["cleaner*", "cli*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
