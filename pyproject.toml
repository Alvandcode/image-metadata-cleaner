[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-metadata-cleaner"
# Single source of truth: cleaner/__init__.py. A tag or an install can no longer
# disagree with the version the CLI reports.
dynamic = ["version"]
description = "Remove EXIF/GPS metadata from images — privacy-first cleaner with batch mode, watermark and Flask API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["exif", "metadata", "privacy", "images", "security-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
]
# Pinned to the versions CI runs, so an install is reproducible.
dependencies = [
    "pillow==12.3.0",
    "piexif==1.1.3",
    "flask==3.1.3",
    "werkzeug==3.1.8",
]

[project.scripts]
# `cli.main:cli` wraps main() in sys.exit so the exit code is real.
# Pointing straight at `cli.main:main` made img-clean always exit 0.
img-clean = "cli.main:cli"

[project.optional-dependencies]
heic = ["pillow-heif==1.7.0"]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "hypothesis==6.168.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "pillow-heif==1.7.0",
    "zizmor==1.30.1",
    "pip-audit==2.10.1",
]

[project.urls]
Homepage = "https://alvandcode.github.io/image-metadata-cleaner/"
Repository = "https://github.com/Alvandcode/image-metadata-cleaner"
Changelog = "https://github.com/Alvandcode/image-metadata-cleaner/releases"

[tool.setuptools.packages.find]
include = ["cleaner*", "cli*", "api*"]

[tool.setuptools.dynamic]
version = { attr = "cleaner.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["cleaner", "cli", "api"]
branch = false

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # long lines are allowed up to line-length via formatter
    "RUF001", # ambiguous unicode (Persian strings are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["cleaner", "cli", "api"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
