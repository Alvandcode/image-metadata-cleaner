name: Bug report
description: Something is broken (CLI, library, API or the web app)
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do **not** paste a real photo with your
        home location in it — describe the metadata instead.
  - type: dropdown
    id: component
    attributes:
      label: Which part?
      options:
        - Web app (docs/ PWA)
        - CLI (img-clean)
        - Python library (cleaner)
        - API (api.server)
        - Docker image
        - Packaging / CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `img-clean --version` or the deployed commit
      placeholder: "0.3.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. run `img-clean portrait.jpg -o out.jpg`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact error text / traceback and the output of `img-clean <file> --analyze`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12.10, Pillow 12.3.0, Pillow has HEIF: no"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach an unscrubbed original photo (or I stripped the location myself)
          required: true
