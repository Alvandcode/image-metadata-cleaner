name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check --output-format=github .
      - name: ruff (format check)
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: test (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        # The coverage gate is a floor, not a goal: raise it when the suite grows.
        run: pytest --cov=cleaner --cov=cli --cov=api --cov-report=term-missing --cov-fail-under=80
      - name: CLI smoke test (real exit codes)
        shell: bash
        run: |
          img-clean --help
          img-clean --version
          # `set -e` is on, so assert the failure explicitly instead of
          # chaining with `;` (which would abort the step).
          if img-clean missing-file.jpg; then
            echo "::error::img-clean exited 0 for a missing input"
            exit 1
          fi
          echo "exit codes behave correctly"

  docker:
    name: docker build + healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t metadata-cleaner:ci .
      - name: API answers on the published port, CLI is installed
        run: |
          docker run -d --name imc -p 5000:5000 metadata-cleaner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/health
          docker exec imc img-clean --version
          docker rm -f imc

  security:
    name: workflow + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install auditors
        # Pinned so an upstream release cannot silently change what "clean" means.
        run: python -m pip install zizmor==1.30.1 pip-audit==2.10.1
      - name: Audit our own workflows (pinning, permissions, injection)
        run: zizmor .github/workflows
      - name: Audit the pinned runtime dependencies (OSV + PyPI advisories)
        run: pip-audit --requirement requirements.txt

  dependency-review:
    name: dependency review
    # Only meaningful on pull requests, and it needs the PR to compare against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
