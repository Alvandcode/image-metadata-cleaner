name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          img-clean --version
          python -m pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  build-binary:
    name: standalone CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: img-clean-linux
          - os: windows-latest
            artifact: img-clean-windows.exe
          - os: macos-latest
            artifact: img-clean-macos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build single-file binary (no server, CLI only)
        run: >
          pyinstaller --onefile --clean --noconfirm
          --name img-clean
          --paths .
          --hidden-import cleaner.exif_cleaner
          --collect-submodules PIL
          cli/main.py
      - name: Smoke test
        shell: bash
        run: |
          BIN=dist/img-clean
          [ -f "$BIN.exe" ] && BIN=dist/img-clean.exe
          "$BIN" --version
          "$BIN" --help
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/img-clean*

  release:
    name: publish GitHub release
    needs: [build-dist, build-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -maxdepth 2 -exec cp {} release/ \;
          ls -la release
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release/*
