name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the PWA has no network calls
        run: |
          # The whole privacy promise is "no upload". Fail the build if the app
          # grows a fetch/XHR/WebSocket/beacon call to a remote origin.
          if grep -RInE "(fetch|XMLHttpRequest|WebSocket|sendBeacon)\s*\([^)]*https?://" docs/*.js docs/*.html; then
            echo "::error::The PWA must never talk to a remote origin."
            exit 1
          fi
          test -f docs/index.html
          test -f docs/sw.js
          test -f docs/manifest.json
      - name: Every file the manifest points at must exist
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("docs")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          refs = [i["src"] for i in manifest.get("icons", [])]
          refs += [s["src"] for s in manifest.get("screenshots", [])]
          refs.append(manifest.get("start_url", "./"))
          missing = [r for r in refs if not (root / r.lstrip("./")).exists()]
          if missing:
              sys.exit(f"manifest references missing files: {missing}")
          print(f"manifest references {len(refs)} files, all present")
          PY
      - name: Stamp the service-worker cache version with this commit
        run: |
          # Without this the browser keeps serving the previous app shell from
          # cache forever, because the cache name never changes.
          version="imc-${GITHUB_SHA::12}"
          sed -i -E "s|^const VERSION = \"imc-[^\"]*\";|const VERSION = \"${version}\";|" docs/sw.js
          grep -q "const VERSION = \"${version}\";" docs/sw.js || {
            echo "::error::could not stamp the service-worker cache version"
            exit 1
          }
          grep -n '^const VERSION' docs/sw.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
